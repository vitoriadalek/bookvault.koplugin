name: Finalize BookVault
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate action layer safely
        shell: python
        run: |
          from pathlib import Path
          main = Path('main.lua')
          text = main.read_text(encoding='utf-8')
          marker = 'require("bookvault_actions").install(BookVault)'
          if marker not in text:
              needle = '\nreturn BookVault'
              if needle not in text:
                  raise SystemExit('BookVault return marker not found; refusing to modify main.lua')
              text = text.replace(needle, '\n' + marker + needle, 1)
              main.write_text(text, encoding='utf-8')
          meta = Path('_meta.lua')
          mt = meta.read_text(encoding='utf-8')
          import re
          mt2 = re.sub(r'version\\s*=\\s*"[^"]+"', 'version = "3.0.0"', mt, count=1)
          meta.write_text(mt2, encoding='utf-8')
          readme = Path('README.md')
          rt = readme.read_text(encoding='utf-8')
          if '## 3.0.0 — ações e segurança integradas' not in rt:
              block = '''\n## 3.0.0 — ações e segurança integradas\n\n- Menu contextual por livro com informações, coleções, renomear, copiar, mover, excluir e localização.\n- Seleção múltipla com ações em lote e atualização segura do mosaico.\n- Informações do livro reutilizando o BookInfo nativo do KOReader.\n- Edição de metadados e capas pela infraestrutura nativa do KOReader.\n- Busca de capas sob demanda no Google Imagens, sem busca durante o scan normal.\n- Privacidade separada da proteção: “Privacidade: ON/OFF”; ativar ocultação não pede senha, desativar para revelar pede senha.\n- Proteção de pastas integrada ao File Browser atual por instância, sem monkey patch global das classes do KOReader.\n- Coleções nativas gerenciadas diretamente pelo BookVault.\n- Camada de ações isolada em `bookvault_actions.lua` para preservar o núcleo visual estável.\n- Nenhuma funcionalidade visual anterior foi removida.\n\n'''
              rt = rt.replace('## 2.5.0 — fechamento visual e compatibilidade', block + '## 2.5.0 — fechamento visual e compatibilidade', 1)
              readme.write_text(rt, encoding='utf-8')
      - name: Syntax check
        run: |
          if command -v luajit >/dev/null 2>&1; then
            luajit -b main.lua /tmp/bookvault_main.bc
            luajit -b bookvault_actions.lua /tmp/bookvault_actions.bc
          elif command -v lua >/dev/null 2>&1; then
            lua -e 'assert(loadfile("main.lua")); assert(loadfile("bookvault_actions.lua"))'
          else
            echo 'No Lua interpreter on runner; performing structural checks.'
            grep -q 'require("bookvault_actions").install(BookVault)' main.lua
            grep -q 'function M.install(BV)' bookvault_actions.lua
          fi
      - name: Commit and clean temporary workflows
        run: |
          git config user.name 'BookVault Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/introspect.yml .github/workflows/finalize-bookvault.yml
          git add main.lua _meta.lua README.md bookvault_actions.lua .github/workflows
          git diff --cached --check
          git commit -m 'BookVault 3.0.0: actions, metadata, privacy and folder protection'
          git push
