name: BookVault sort UX finalizer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sort UX
        run: python3 .github/sort_patch.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "Vitoria"
          git config user.email "166748655+vitoriadalek@users.noreply.github.com"
          git add main.lua _meta.lua README.md
          git commit -m "Add intuitive sort direction controls"
          git rm .github/sort_patch.py .github/workflows/sort-final.yml
          git commit -m "Remove temporary sort finalizer"
          git push origin HEAD:main
