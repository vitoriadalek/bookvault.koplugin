name: BookVault upgrade
on:
  push:
    paths:
      - .github/workflows/bookvault-upgrade.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply upgrade
        run: python .github/bookvault_upgrade.py
      - name: Commit upgrade and remove helper
        run: |
          rm -f .github/bookvault_upgrade.py .github/workflows/bookvault-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'BookVault 2.4.0 polish and stable controls' || exit 0
          git push
