name: BookVault validation

on:
  push:
  pull_request:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate bookvault_actions.lua
        run: luac5.1 -p bookvault_actions.lua
      - name: Validate bookvault_core.lua
        run: luac5.1 -p bookvault_core.lua
      - name: Validate main.lua
        run: luac5.1 -p main.lua
      - name: Validate plugin registration
        run: |
          set -eu
          test ! -e bookvault_impl.lua
          grep -q 'name = "bookvault"' main.lua
          grep -q 'bookvault_core' main.lua
          grep -q 'registerToMainMenu' bookvault_core.lua
          grep -q 'name = "bookvault"' _meta.lua
          grep -q 'version = "3.4.20"' _meta.lua
