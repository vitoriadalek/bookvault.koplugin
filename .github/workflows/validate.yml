name: BookVault validation

on:
  push:
  pull_request:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate Lua syntax
        run: |
          set -eu
          for file in *.lua; do
            luac5.1 -p "$file"
          done
      - name: Validate plugin registration
        run: |
          set -eu
          test ! -e bookvault_impl.lua
          grep -q 'name = "bookvault"' main.lua
          grep -q 'registerToMainMenu' main.lua
          grep -q 'name = "bookvault"' _meta.lua
          grep -q 'version = "3.4.4"' _meta.lua
