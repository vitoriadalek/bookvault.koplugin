name: BookVault finalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BookVault
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')

          imports = '''local ButtonDialog = require("ui/widget/buttondialog")\n'''
          if 'local IconButton = require("ui/widget/iconbutton")' not in s:
              s = s.replace(imports, imports + '''local Geom = require("ui/geometry")\nlocal HorizontalGroup = require("ui/widget/horizontalgroup")\nlocal HorizontalSpan = require("ui/widget/horizontalspan")\nlocal IconButton = require("ui/widget/iconbutton")\nlocal IconWidget = require("ui/widget/iconwidget")\nlocal RightContainer = require("ui/widget/container/rightcontainer")\n''', 1)
          s = s.replace('local TitleBar = require("ui/widget/titlebar")\n', '', 1)

          s = re.sub(r'function BookVault:ensureBookVaultIcons\(\).*?\nend\n\nfunction BookVault:loadBookInfoManager', '''function BookVault:ensureBookVaultIcons()\n    local icon_dir=DataStorage:getDataDir().."/icons"\n    if lfs.attributes(icon_dir,"mode")~="directory" then pcall(lfs.mkdir,icon_dir) end\n    if lfs.attributes(icon_dir,"mode")~="directory" then return false end\n    local required={"bookvault-search.png","bookvault-sort.png","bookvault-sort-cat.png","bookvault-cat.png","bookvault-moon.png"}\n    for _,name in ipairs(required) do\n        if lfs.attributes(icon_dir.."/"..name,"mode")~="file" then return false end\n    end\n    return true\nend\n\nfunction BookVault:loadBookInfoManager''', s, count=1, flags=re.S)

          marker = 'function BookVault:makeBookMenu(name,title,items,view_key)'
          start = s.index(marker)
          end_marker = '\nfunction BookVault:showCollection(collection_name)'
          endpos = s.index(end_marker, start)
          new_func = r'''function BookVault:decorateTitleBar(menu, appearance, search_cb, sort_cb)
    local bar=menu and menu.title_bar
    if not bar then return end

    -- Some KOReader generations expose only one right-side title-bar button.
    -- Keep the native back/close behavior on the left and replace the right
    -- action with a compact BookVault group containing Search + Sort + Moon.
    local old_right=bar.right_button
    if old_right then
        for i=1,#bar do
            if bar[i]==old_right then table.remove(bar,i); break end
        end
        pcall(old_right.free,old_right,true)
        bar.right_button=nil
        bar.has_right_icon=false
    end

    if bar._bookvault_action_group then
        pcall(bar._bookvault_action_group.free,bar._bookvault_action_group,true)
        bar._bookvault_action_group=nil
    end

    local icon_size=Screen:scaleBySize(25)
    local button_padding=Screen:scaleBySize(5)
    local gap=Screen:scaleBySize(2)
    local group=HorizontalGroup:new{ align="center" }

    local search_button=IconButton:new{
        icon="bookvault-search",
        width=icon_size,
        height=icon_size,
        padding=button_padding,
        callback=search_cb,
        show_parent=menu,
    }
    table.insert(group,search_button)

    if appearance.show_moon then
        table.insert(group,HorizontalSpan:new{width=gap})
        table.insert(group,IconWidget:new{
            icon="bookvault-moon",
            width=Screen:scaleBySize(18),
            height=Screen:scaleBySize(18),
            dim=true,
        })
    end

    table.insert(group,HorizontalSpan:new{width=gap})
    table.insert(group,IconButton:new{
        icon=appearance.show_cat and "bookvault-sort-cat" or "bookvault-sort",
        width=icon_size,
        height=icon_size,
        padding=button_padding,
        callback=sort_cb,
        show_parent=menu,
    })

    local width=bar.width or Screen:getWidth()
    local height=(bar.getHeight and bar:getHeight()) or Screen:scaleBySize(44)
    local right=RightContainer:new{
        dimen=Geom:new{x=0,y=0,w=width,h=height},
        group,
    }
    table.insert(bar,right)
    bar._bookvault_action_group=right
    pcall(function() UIManager:setDirty(menu,"ui",bar.dimen) end)
end

function BookVault:makeBookMenu(name,title,items,view_key)
    local menu
    self:ensureBookVaultIcons()
    self:loadSettings()
    local appearance=self.settings.data.appearance
    if appearance.show_cat == nil then appearance.show_cat=true end
    if appearance.show_moon == nil then appearance.show_moon=true end
    local function search_cb() self:showSearchDialog(menu) end
    local function sort_cb() self:showSortDialog(menu) end

    menu=BookList:new{
        name=name,
        title=title,
        item_table=items,
        covers_fullscreen=true,
        onMenuSelect=function(_,item) self:guard(item.path,function()
            if lfs.attributes(item.path,"mode")~="file" then UIManager:show(InfoMessage:new{text=_("O arquivo não existe mais.")}); return end
            ReaderUI:showReader(item.path)
        end) end,
    }
    self._last_menu=menu
    menu._bookvault_view_key=view_key or name
    menu._bookvault_source_items=self:applyCustomOrder(items,menu._bookvault_view_key)
    menu.item_table=copyItems(menu._bookvault_source_items)
    self:loadSettings()
    local saved_sort=self.settings.data.sort_modes[menu._bookvault_view_key]
    if saved_sort and saved_sort ~= "custom" then self:sortBookVaultItems(menu,saved_sort) end
    local ok_visual=self:prepareVisualMenu(menu,menu._bookvault_source_items)
    if not ok_visual then menu._bookvault_source_items=items; menu.item_table=items end
    self:decorateTitleBar(menu,appearance,search_cb,sort_cb)
    return menu
end
'''
          s = s[:start] + new_func + s[endpos:]

          old_apply = '''                menu.no_refresh_covers=true; menu:updateItems(); menu.no_refresh_covers=nil\n'''
          new_apply = '''                menu.no_refresh_covers=true\n                if menu._recalculateDimen then pcall(menu._recalculateDimen,menu) end\n                menu:updateItems()\n                menu.no_refresh_covers=nil\n'''
          if old_apply in s:
              s=s.replace(old_apply,new_apply,1)

          p.write_text(s,encoding='utf-8')

          b = Path('bookvault_icons_bootstrap.lua')
          bs=b.read_text(encoding='utf-8')
          bs=bs.replace('["bookvault-search.png"] = "bookvault-search-png.png",','["bookvault-search.png"] = "bookvault-search.png",')
          b.write_text(bs,encoding='utf-8')

          m=Path('_meta.lua')
          ms=m.read_text(encoding='utf-8').replace('version = "2.4.1"','version = "2.5.0"')
          ms=ms.replace('description = "Visual reading library with real cover mosaic, visible search and sorting, metadata-aware search, persistent custom order, customizable grid, KOReader collections, private content and password-protected folders."','description = "Visual reading library with real cover mosaic, persistent search and sorting controls, metadata-aware search, persistent custom order, customizable grid, KOReader collections, private content and password-protected folders, with lightweight PNG identity icons and a title-bar compatibility fallback."')
          m.write_text(ms,encoding='utf-8')

          r=Path('README.md')
          rs=r.read_text(encoding='utf-8')
          rs=rs.replace('2.4.1','2.5.0')
          if 'title-bar compatibility fallback' not in rs:
              rs=rs.replace('## Recursos','## Recursos\n\n- **Barra superior compatível:** busca, ordenação e identidade visual são montadas sobre a barra nativa do KOReader, incluindo fallback para versões que não exibem `custom_title_bar`.\n- **Ícones PNG leves:** busca, ordenação, gatinho e lua usam PNGs transparentes pequenos, sem emojis e sem depender de SVG legado.')
          r.write_text(rs,encoding='utf-8')

          # Remove legacy SVG assets from the repository. The bootstrap also removes
          # any copies left in the user's KOReader icon cache.
          import subprocess
          subprocess.run(['git','rm','-f','bookvault-cat.svg','icons/bookvault-cat.svg','icons/bookvault-sort.svg','icons/bookvault-sort-cat.svg'],check=False)

          # The temporary workflow removes itself after it has validated the patch.
          subprocess.run(['git','rm','-f','.github/workflows/bookvault-finalize.yml'],check=True)

      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'icons/bookvault-search.png', 'icons/bookvault-sort.png',
            'icons/bookvault-sort-cat.png', 'icons/bookvault-cat.png',
            'icons/bookvault-moon.png'
          ]
          for f in required:
              p=Path(f)
              assert p.is_file() and p.stat().st_size > 0, f'Missing PNG: {f}'
          main=Path('main.lua').read_text(encoding='utf-8')
          assert 'function BookVault:decorateTitleBar' in main
          assert 'function BookVault:makeBookMenu' in main
          assert 'bookvault-search' in main and 'bookvault-sort' in main
          assert 'custom_title_bar=' not in main
          boot=Path('bookvault_icons_bootstrap.lua').read_text(encoding='utf-8')
          assert 'bookvault-search.png"] = "bookvault-search.png"' in boot
          assert 'bookvault-search-png.png' not in boot
          print('BookVault static checks: OK')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit -b main.lua /tmp/bookvault-main.ljbc
          luajit -b bookvault_icons_bootstrap.lua /tmp/bookvault-bootstrap.ljbc
          git diff --check

      - name: Commit final version
        run: |
          git config user.name "Vitoria"
          git config user.email "166748655+vitoriadalek@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize BookVault 2.5.0 UI and compatibility"
          git push origin HEAD:main
