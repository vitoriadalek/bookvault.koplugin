name: BookVault validation
on:
  push:
    paths:
      - main.lua
      - _meta.lua
      - icons/**
      - .github/workflows/bookvault-validate.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Lua syntax and assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua5.4 -e 'assert(loadfile("main.lua")); assert(loadfile("_meta.lua")); print("BookVault Lua syntax OK")'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path('icons').glob('*.svg'):
              ET.parse(p)
              print('SVG OK:', p)
          PY
      - name: Remove temporary validator
        run: |
          rm -f .github/workflows/bookvault-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary validation workflow' || exit 0
          git push
